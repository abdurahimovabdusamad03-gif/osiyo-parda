services:
  - type: web
    name: osiyo-parda
    runtime: node
    plan: starter
    buildCommand: "echo no build"
    startCommand: "npm start"
    healthCheckPath: /api/public
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: parda-data
      mountPath: /var/data
      sizeGB: 1
